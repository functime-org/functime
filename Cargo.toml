[package]
name = "functime"
version = "1.0.0-rc.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_functime_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py312", "extension-module"] }
pyo3-polars = { version = "0.13", features = ["derive"] }
serde = { version = "*", features = ["derive"] }
hashbrown = { version = "0.14.2" }
