exclude-labels:
  - skip changelog
  - release

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
replacers:
  # Remove conventional commits from titles
  - search: '/- (build|chore|ci|depr|docs|feat|fix|perf|refactor|release|test)(\(.*\))?(\!)?\: /g'
    replace: '- '

autolabeler:
  - label: breaking
    title:
      # Example: feat!: ...
      - '/^(build|chore|ci|depr|docs|feat|fix|perf|refactor|release|test)(\(.*\))?\!\: /'
  - label: internal
    title:
      - '/^(build|chore|ci|test)/'
  - label: refactor
    title:
      - '/^refactor/'
  - label: docs
    title:
      - '/^docs/'
  - label: enhancement
    title:
      - '/^feat/'
  - label: bug
    title:
      - '/^fix/'
  - label: perf
    title:
      - '/^perf/'

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  $CHANGES

  Thank you to all our contributors for making this release possible!
  $CONTRIBUTORS

categories:
  - title: 💥 Breaking changes
    labels:
      - breaking
  - title: 🚀 Performance improvements
    labels:
      - perf
  - title: ✨ Enhancements
    labels:
      - enhancement
  - title: 🐞 Bug fixes
    labels:
      - bug
  - title: ♻️ Refactors
    labels:
      - refactor
  - title: 📝 Documentation
    labels:
      - docs
  - title: 🛠️ Internal
    labels:
      - internal

version-resolver:
  minor:
    labels:
      - breaking
  default: patch
