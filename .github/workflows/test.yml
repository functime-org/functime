name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - 'functime/**'
      - 'packages/functime-rust/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install functime
        run: |
          uv sync --python "${{ matrix.python-version }}" --no-dev --group test --extra tree --locked

      - name: Test
        env:
          FUNCTIME__TEST_MODE: "true"
        run: |
          uv run --no-sync pytest tests -vv --show-capture=no --tb=line --benchmark-disable -k "not test_benchmarks"

  test-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        working-directory: packages/functime-rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/functime-rust

      - name: Install functime with functime-rust
        env:
          RUSTFLAGS: -C debuginfo=0
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          uv sync --python "3.12" --no-dev --group test --extra tree --extra rust --locked

      - name: Test
        env:
          FUNCTIME__TEST_MODE: "true"
        run: |
          uv run --no-sync python -c "import functime._rust as r; assert r.HAS_RUST and r.PLUGIN_PATH is not None"
          uv run --no-sync pytest tests -vv --show-capture=no --tb=line --benchmark-disable -k "not test_benchmarks"
