name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - 'functime/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install functime
        env:
          RUSTFLAGS: -C debuginfo=0
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          uv sync --python "${{ matrix.python-version }}" --no-dev --group test --extra tree --locked
          uv run --with "maturin>=1.5" -- maturin develop --extras=tree

      - name: Test
        env:
          FUNCTIME__TEST_MODE: "true"
        run: |
          uv run pytest tests -vv --show-capture=no --tb=line --benchmark-disable -k "not test_benchmarks"
