name: Run Benchmarks

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        os:
          - "ubuntu-latest-16-cores"
          - "ubuntu-latest-32-cores"
          - "ubuntu-latest-64-cores"
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --group benchmark --locked

      - name: Benchmark
        run: |
          uv run pytest -k "test_benchmark" -vv \
            --benchmark-name=short \
            --benchmark-group-by=param \
            --benchmark-min-rounds=3 \
            --benchmark-columns=min,max,mean,median,stddev,rounds,iterations \
            --benchmark-json=docs/benchmarks/${{ matrix.os }}.json

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "docs: Update ${{ matrix.os }} benchmark"
          file_pattern: docs/benchmarks/${{ matrix.os }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
