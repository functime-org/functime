name: Quickstart

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "functime/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/code/quickstart.py"
      - "docs/code/feature_engineering.py"
      - ".github/workflows/quickstart.yml"
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quickstart:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install functime
        run: |
          uv sync --python "${{ matrix.python-version }}" --no-dev --locked

      - name: Run Quickstart
        run: |
          uv run --no-sync python docs/code/quickstart.py
          uv run --no-sync python docs/code/feature_engineering.py
