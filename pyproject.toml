[project]
name = "functime"
version = "1.0.0"
description = "Time-series machine learning at scale."
readme = "README.md"
authors = [
  { name = "Chris Lo", email = "chris@functime.ai" },
  { name = "Daryl Lim", email = "daryl@functime.ai" },
  { name = "Mathieu Cayssol", email = "mathieu.cayssol@gmail.com"}
]
maintainers = [
  { name = "functime Team", email = "team@functime.ai" },
  { name = "Luca Baggi" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.12"
dependencies = [
  "cloudpickle",
  "holidays",
  "numpy",
  "polars>=1.0",
  "scikit-learn>=1.2.2",
  "scipy>=1.11",
  "tqdm",
]

[project.optional-dependencies]
plot = [
  "kaleido==0.2.1",
  "pandas",
  "plotly",
]
cat = [
  "catboost",
]
lgb = [
  "lightgbm",
]
xgb = [
  "pyarrow",
  "xgboost",
]
ann = [
  "pyarrow",
  "pylance",
]
tree = [
  # CatBoost does not publish Python 3.15 wheels yet
  "functime[cat]; python_version < '3.15'",
  "functime[lgb,xgb]",
]
all = [
  "functime[ann,tree,plot]",
]

[dependency-groups]
dev = [
  "pre-commit",
  { include-group = "doc" },
  { include-group = "test" },
]
doc = [
  "jupyterlab",
  "mkdocs",
  "mkdocs-jupyter",
  "mkdocs-material",
  "mkdocstrings-python",
]
test = [
  "pandas",
  "plotly",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-benchmark",
]
benchmark = [
  "aeon<0.5.0",
  "joblib",
  "mlforecast==0.8.1",
  "pandas",
  "pyarrow",
  "pytest",
  "pytest-memray",
  "pytest-timeout",
  "statsmodels",
  "tsfresh",
  { include-group = 'test'}
]

[tool.maturin]
module-name = "functime._functime_rust"
features = ["pyo3/extension-module"]
exclude = [
  "docs/**",
  "site/**",
  "tests/**",
  ".pre-commit-config.yaml",
]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
  "YTT", # flake8-2020
]
ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "B905", # `zip()` without an explicit `strict=` parameter
  "B018", # Found useless expression.
  "F821", # Undefined name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I002"]
"docs/**" = ["I002"]
"**.ipynb" = ["E402"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-m not benchmark and not slow",
  "--benchmark-disable",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "benchmark: marks tests as part of benchmarking",
  "multivariate: marks multivariate forecast test",
]
xfail_strict = true

[build-system]
build-backend = "maturin"
requires = [
  "maturin<2,>=1.3.2",
]

[tool.uv]
required-version = ">=0.8"
